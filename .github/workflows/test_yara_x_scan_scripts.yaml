---
name: test_yara_x_scan_scripts

# Smoke tests for the three YARA-X PHP and Node.js scan scripts. Each job plants
# a real PHP runtime, an official Node.js build and decoys in a folder, scans
# that folder at the default (1 thread) and with 2 threads, and checks the
# "path<TAB>product<TAB>version" summary - what is reported and what isn't:
#   found:     the PHP binary/DLLs and node, and a renamed copy of each
#              (detection is by content), with their exact versions
#   found:     a native addon decoy (an executable with only the N-API export),
#              reported as "node unknown" and never with a version
#   found:     (Linux, Windows) an official Electron build, reported as exactly
#              two lines: its embedded node version and its electron version
#   found:     (Linux, macOS) copies with a newline / tab in the file or folder
#              name, reported as bash $'...' quoted paths
#   not found: a copy in an excluded folder (-x / -ExcludePath), a copy with a
#              skipped extension (.zip, and .png with a newline in the name), an
#              empty file, and a php_version.h text file
# A separate job fails if a copy made by YARA/sync_rules.py (the header check,
# the rules and the awk embedded in the scripts) differs from its source, or if
# a rule file under YARA doesn't compile with yr.
# Runs only when this workflow, one of the three scripts or YARA changes.
on:
  push:
    branches:
      - master
    paths:
      - bash/yara_x_scan_linux.sh
      - bash/yara_x_scan_macos.sh
      - powershell/yara_x_scan_windows.ps1
      - YARA/**
      - .github/workflows/test_yara_x_scan_scripts.yaml
  pull_request:
    paths:
      - bash/yara_x_scan_linux.sh
      - bash/yara_x_scan_macos.sh
      - powershell/yara_x_scan_windows.ps1
      - YARA/**
      - .github/workflows/test_yara_x_scan_scripts.yaml

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Embedded rule copies match their sources
        # Lists each out-of-date file and exits 1; fix with python3 YARA/sync_rules.py
        run: python3 YARA/sync_rules.py --check

      - name: Rule files compile with yr
        run: |
          # Same yr release and SHA256 as the Linux scan script pins
          eval "$(grep -E '^(YARAX_VERSION|SHA256_X86_64)=' bash/yara_x_scan_linux.sh)"
          asset="yara-x-v${YARAX_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/VirusTotal/yara-x/releases/download/v${YARAX_VERSION}/$asset"
          echo "$SHA256_X86_64  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          for r in YARA/*.yar YARA/php/*.yar YARA/node/*.yar; do
            echo "compile $r"; "$RUNNER_TEMP/yr" compile -o /dev/null "$r"
          done
          # README: the rule files can be loaded together (no rule name collisions)
          "$RUNNER_TEMP/yr" compile -o /dev/null YARA/*.yar YARA/php/*.yar YARA/node/*.yar

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Official build; SHA256 from https://nodejs.org/dist/v22.23.4/SHASUMS256.txt
      NODE_URL: https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz
      NODE_SHA256: 1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce
      NODE_EXPECT: 22.23.4
      # Official build; SHA256 from
      # https://github.com/electron/electron/releases/download/v44.7.0/SHASUMS256.txt
      ELECTRON_URL: https://github.com/electron/electron/releases/download/v44.7.0/electron-v44.7.0-linux-x64.zip
      ELECTRON_SHA256: 3ae7d5bdad61c664486c6ab61361dd084d064c8c08af8d13a687096e18ce555a
      ELECTRON_EXPECT: 44.7.0
      # the Node.js embedded in Electron 44.7.0 (node.js/v... in the binary)
      ELECTRON_NODE_EXPECT: 24.21.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install distro PHP (a real, unpacked ELF runtime)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends php8.3-cli
          echo "PHP_EXPECT=$(php -r 'echo PHP_VERSION;')" >> "$GITHUB_ENV"

      - name: Plant fixtures
        run: |
          F="$RUNNER_TEMP/fixtures"
          mkdir -p "$F/bin" "$F/renamed" "$F/excluded" "$F/decoys"
          cp "$(readlink -f "$(command -v php)")" "$F/bin/php"
          cp "$F/bin/php" "$F/renamed/webd"
          cp "$F/bin/php" "$F/excluded/php"
          cp "$F/bin/php" "$F/decoys/php.zip"
          : > "$F/decoys/empty"
          printf '#define PHP_MAJOR_VERSION 8\n#define PHP_VERSION "8.3.1"\n' > "$F/decoys/php_version.h"
          # control characters in a file or folder name: scanned as copies
          mkdir -p "$F/odd/dir"$'\n'"nl"
          cp "$F/bin/php" "$F/odd/new"$'\n'"line"
          cp "$F/bin/php" "$F/odd/tab"$'\t'"php"
          cp "$F/bin/php" "$F/odd/dir"$'\n'"nl/php"
          cp "$F/bin/php" "$F/decoys/new"$'\n'"line.png"
          # Node.js: the official node, a renamed copy, and a native addon decoy
          # (only the N-API export: must be "node unknown", never a version)
          mkdir -p "$F/node" "$F/addon" "$RUNNER_TEMP/dl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dl/node.tar.xz" "$NODE_URL"
          echo "$NODE_SHA256  $RUNNER_TEMP/dl/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/dl/node.tar.xz" -C "$F/node" --strip-components=2 --wildcards '*/bin/node'
          cp "$F/node/node" "$F/renamed/jsd"
          printf 'int napi_register_module_v1(void) { return 0; }\n' | gcc -shared -fPIC -x c - -o "$F/addon/addon.node"
          # Electron: the official electron binary (embeds Node.js)
          mkdir -p "$F/electron"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dl/electron.zip" "$ELECTRON_URL"
          echo "$ELECTRON_SHA256  $RUNNER_TEMP/dl/electron.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dl/electron.zip" electron -d "$F/electron"

      - name: Scan and check (1 thread default, then -T 2)
        run: |
          F="$RUNNER_TEMP/fixtures"
          # The script reports paths resolved with pwd -P
          RF=$(cd "$F" && pwd -P)
          SH=$(command -v bash)
          for threads in default 2; do
            out="$RUNNER_TEMP/out-$threads"
            rm -rf "$out" "$out.console"
            args=(-t "$F" -o "$out" -x "$F/excluded")
            [ "$threads" = default ] || args+=(-T "$threads")
            set +e
            "$SH" bash/yara_x_scan_linux.sh "${args[@]}" 2>&1 | tee "$out.console"
            rc=${PIPESTATUS[0]}
            set -e
            [ "$rc" -eq 1 ] || { echo "::error::expected exit 1 (matches found), got $rc"; exit 1; }
            want_threads=1; [ "$threads" = default ] || want_threads=$threads
            grep -q "Scanning with $want_threads thread(s)" "$out.console" || { echo "::error::expected $want_threads thread(s)"; exit 1; }
            results=$(ls "$out"/yara_results_*.text | grep -v '\.raw\.text$')
            cat "$results"
            for p in bin/php renamed/webd; do
              grep -qx "$RF/$p	php	$PHP_EXPECT" "$results" || { echo "::error::$p with php $PHP_EXPECT not reported"; exit 1; }
            done
            for p in node/node renamed/jsd; do
              grep -qx "$RF/$p	node	$NODE_EXPECT" "$results" || { echo "::error::$p with node $NODE_EXPECT not reported"; exit 1; }
            done
            # the addon decoy: exactly one line, with no version
            [ "$(grep -c "^$RF/addon/addon.node	" "$results")" -eq 1 ] &&
              grep -qx "$RF/addon/addon.node	node	unknown" "$results" || { echo "::error::addon.node not reported as just node unknown"; exit 1; }
            # Electron: exactly two lines, its embedded node and its electron version
            [ "$(grep -c "^$RF/electron/electron	" "$results")" -eq 2 ] &&
              grep -qx "$RF/electron/electron	node	$ELECTRON_NODE_EXPECT" "$results" &&
              grep -qx "$RF/electron/electron	electron	$ELECTRON_EXPECT" "$results" || { echo "::error::electron not reported as just node $ELECTRON_NODE_EXPECT and electron $ELECTRON_EXPECT"; exit 1; }
            # reported as the bash $'...' quoted path ($SH: the bash that ran the script)
            for p in "odd/new"$'\n'"line" "odd/tab"$'\t'"php" "odd/dir"$'\n'"nl/php"; do
              q=$("$SH" -c 'printf %q "$1"' _ "$RF/$p")
              grep -qxF "$q	php	$PHP_EXPECT" "$results" || { echo "::error::$q with php $PHP_EXPECT not reported"; exit 1; }
            done
            if grep -E "/(excluded|decoys)/" "$results"; then echo "::error::excluded or decoy file reported"; exit 1; fi
            if grep /copies/ "$results"; then echo "::error::work-folder copy path reported"; exit 1; fi
          done

  macos:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      # static-php.dev macOS builds are unpacked (its Linux builds are UPX-packed)
      PHP_URL: https://dl.static-php.dev/static-php-cli/common/php-8.3.32-cli-macos-aarch64.tar.gz
      PHP_SHA256: 1cc8148750bd1722031daba1618825a8b7d0a3830bb92c50d8dd844a1dcfb306
      PHP_EXPECT: 8.3.32
      # Official build; SHA256 from https://nodejs.org/dist/v22.23.4/SHASUMS256.txt
      NODE_URL: https://nodejs.org/dist/v22.23.4/node-v22.23.4-darwin-arm64.tar.gz
      NODE_SHA256: c9e1dbc748b33ed2d14f42445191ecaf14c56259c7a9a26d0042c49ec2b66428
      NODE_EXPECT: 22.23.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plant fixtures
        run: |
          F="$RUNNER_TEMP/fixtures"
          mkdir -p "$F/bin" "$F/renamed" "$F/excluded" "$F/decoys" "$RUNNER_TEMP/dl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dl/php.tgz" "$PHP_URL"
          echo "$PHP_SHA256  $RUNNER_TEMP/dl/php.tgz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/dl/php.tgz" -C "$F/bin" php
          cp "$F/bin/php" "$F/renamed/webd"
          cp "$F/bin/php" "$F/excluded/php"
          cp "$F/bin/php" "$F/decoys/php.zip"
          : > "$F/decoys/empty"
          printf '#define PHP_MAJOR_VERSION 8\n#define PHP_VERSION "8.3.1"\n' > "$F/decoys/php_version.h"
          # control characters in a file or folder name: scanned as copies
          mkdir -p "$F/odd/dir"$'\n'"nl"
          cp "$F/bin/php" "$F/odd/new"$'\n'"line"
          cp "$F/bin/php" "$F/odd/tab"$'\t'"php"
          cp "$F/bin/php" "$F/odd/dir"$'\n'"nl/php"
          cp "$F/bin/php" "$F/decoys/new"$'\n'"line.png"
          # Node.js: the official node, a renamed copy, and a native addon decoy
          # (only the N-API export: must be "node unknown", never a version)
          mkdir -p "$F/node" "$F/addon"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dl/node.tgz" "$NODE_URL"
          echo "$NODE_SHA256  $RUNNER_TEMP/dl/node.tgz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/dl/node.tgz" -C "$F/node" --strip-components=2 '*/bin/node'
          cp "$F/node/node" "$F/renamed/jsd"
          printf 'int napi_register_module_v1(void) { return 0; }\n' | cc -bundle -x c - -o "$F/addon/addon.node"

      - name: Scan and check (1 thread default, then -T 2)
        run: |
          F="$RUNNER_TEMP/fixtures"
          # The scripts resolve paths with pwd -P (/var -> /private/var on macOS)
          RF=$(cd "$F" && pwd -P)
          SH=/bin/bash
          for threads in default 2; do
            out="$RUNNER_TEMP/out-$threads"
            rm -rf "$out" "$out.console"
            args=(-t "$F" -o "$out" -x "$F/excluded")
            [ "$threads" = default ] || args+=(-T "$threads")
            set +e
            "$SH" bash/yara_x_scan_macos.sh "${args[@]}" 2>&1 | tee "$out.console"
            rc=${PIPESTATUS[0]}
            set -e
            [ "$rc" -eq 1 ] || { echo "::error::expected exit 1 (matches found), got $rc"; exit 1; }
            want_threads=1; [ "$threads" = default ] || want_threads=$threads
            grep -q "Scanning with $want_threads thread(s)" "$out.console" || { echo "::error::expected $want_threads thread(s)"; exit 1; }
            results=$(ls "$out"/yara_results_*.text | grep -v '\.raw\.text$')
            cat "$results"
            for p in bin/php renamed/webd; do
              grep -qx "$RF/$p	php	$PHP_EXPECT" "$results" || { echo "::error::$p with php $PHP_EXPECT not reported"; exit 1; }
            done
            for p in node/node renamed/jsd; do
              grep -qx "$RF/$p	node	$NODE_EXPECT" "$results" || { echo "::error::$p with node $NODE_EXPECT not reported"; exit 1; }
            done
            # the addon decoy: exactly one line, with no version
            [ "$(grep -c "^$RF/addon/addon.node	" "$results")" -eq 1 ] &&
              grep -qx "$RF/addon/addon.node	node	unknown" "$results" || { echo "::error::addon.node not reported as just node unknown"; exit 1; }
            # reported as the bash $'...' quoted path ($SH: the bash that ran the script)
            for p in "odd/new"$'\n'"line" "odd/tab"$'\t'"php" "odd/dir"$'\n'"nl/php"; do
              q=$("$SH" -c 'printf %q "$1"' _ "$RF/$p")
              grep -qxF "$q	php	$PHP_EXPECT" "$results" || { echo "::error::$q with php $PHP_EXPECT not reported"; exit 1; }
            done
            if grep -E "/(excluded|decoys)/" "$results"; then echo "::error::excluded or decoy file reported"; exit 1; fi
            if grep /copies/ "$results"; then echo "::error::work-folder copy path reported"; exit 1; fi
          done

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      # archives/ keeps a stable URL after newer releases ship
      PHP_URL: https://windows.php.net/downloads/releases/archives/php-8.3.35-nts-Win32-vs16-x64.zip
      PHP_SHA256: 25a8e2ac9ff30f1d768d1447c09a600617fa6e6082729f6e95f008b59c91fe45
      PHP_EXPECT: 8.3.35
      # Official build; SHA256 from https://nodejs.org/dist/v22.23.4/SHASUMS256.txt
      NODE_URL: https://nodejs.org/dist/v22.23.4/node-v22.23.4-win-x64.zip
      NODE_SHA256: cbc74b5e0982c9dbb41525fd8fb5dcd32fbee237863f7829072f4639a1ce5f20
      NODE_EXPECT: 22.23.4
      # Official build; SHA256 from
      # https://github.com/electron/electron/releases/download/v44.7.0/SHASUMS256.txt
      ELECTRON_URL: https://github.com/electron/electron/releases/download/v44.7.0/electron-v44.7.0-win32-x64.zip
      ELECTRON_SHA256: eee30dc8fa1f5ea95490e59f44e46ea68dd24c6e93d22facf70fe5c2d4c2665c
      ELECTRON_EXPECT: 44.7.0
      # the Node.js embedded in Electron 44.7.0 (node.js/v... in the binary)
      ELECTRON_NODE_EXPECT: 24.21.0
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plant fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          $F = Join-Path $env:RUNNER_TEMP 'fixtures'
          New-Item -ItemType Directory -Force -Path "$F\renamed", "$F\excluded", "$F\decoys" | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'php.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $env:PHP_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:PHP_SHA256) { throw "PHP zip SHA256 mismatch: $hash" }
          Expand-Archive -LiteralPath $zip -DestinationPath "$F\php"
          Copy-Item "$F\php\php8.dll" "$F\renamed\webd.dll"
          Copy-Item "$F\php\php8.dll" "$F\excluded\php8.dll"
          Copy-Item "$F\php\php8.dll" "$F\decoys\php8.zip"
          New-Item -ItemType File -Path "$F\decoys\empty" | Out-Null
          Set-Content -Path "$F\decoys\php_version.h" -Value "#define PHP_MAJOR_VERSION 8`n#define PHP_VERSION `"8.3.1`""
          # Node.js: the official node.exe, a renamed copy, and a native addon decoy
          # (a PE DLL whose only Node marker is the N-API export name: must be
          # "node unknown", never a version)
          $nodeZip = Join-Path $env:RUNNER_TEMP 'node.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $env:NODE_URL -OutFile $nodeZip
          $hash = (Get-FileHash -Algorithm SHA256 $nodeZip).Hash.ToLowerInvariant()
          if ($hash -ne $env:NODE_SHA256) { throw "Node zip SHA256 mismatch: $hash" }
          Expand-Archive -LiteralPath $nodeZip -DestinationPath "$env:RUNNER_TEMP\nodezip"
          New-Item -ItemType Directory -Force -Path "$F\node", "$F\addon" | Out-Null
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\nodezip\*\node.exe").FullName "$F\node\node.exe"
          Copy-Item "$F\node\node.exe" "$F\renamed\jsd.exe"
          Add-Type -TypeDefinition 'public static class Addon { public static int napi_register_module_v1() { return 0; } }' `
            -OutputAssembly "$F\addon\addon.node" -OutputType Library
          # Electron: the official electron.exe (embeds Node.js); only that file
          # is kept, so its DLLs (ffmpeg, swiftshader, ...) aren't scanned
          $electronZip = Join-Path $env:RUNNER_TEMP 'electron.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $env:ELECTRON_URL -OutFile $electronZip
          $hash = (Get-FileHash -Algorithm SHA256 $electronZip).Hash.ToLowerInvariant()
          if ($hash -ne $env:ELECTRON_SHA256) { throw "Electron zip SHA256 mismatch: $hash" }
          Expand-Archive -LiteralPath $electronZip -DestinationPath "$env:RUNNER_TEMP\electronzip"
          New-Item -ItemType Directory -Force -Path "$F\electron" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\electronzip\electron.exe" "$F\electron\electron.exe"

      - name: Scan and check (1 thread default, then -Threads 2)
        run: |
          # Continue: a native command's stderr must not abort before the checks below
          $ErrorActionPreference = 'Continue'
          $F = Join-Path $env:RUNNER_TEMP 'fixtures'
          foreach ($threads in @('default', '2')) {
            $out = Join-Path $env:RUNNER_TEMP "out-$threads"
            Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
            $scanArgs = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'powershell\yara_x_scan_windows.ps1',
                          '-Path', $F, '-OutputDir', $out, '-ExcludePath', "$F\excluded")
            if ($threads -ne 'default') { $scanArgs += @('-Threads', $threads) }
            $console = & powershell.exe @scanArgs 6>&1 2>&1 | Out-String
            $rc = $LASTEXITCODE
            Write-Host $console
            if ($rc -ne 1) { throw "expected exit 1 (matches found), got $rc" }
            $wantThreads = if ($threads -eq 'default') { '1' } else { $threads }
            if ($console -notmatch "Scanning with $wantThreads thread\(s\)") { throw "expected $wantThreads thread(s)" }
            $results = Get-ChildItem "$out\yara_results_*.text" | Where-Object { $_.Name -notlike '*.raw.text' }
            $lines = @(Get-Content $results.FullName)
            $lines | Write-Host
            foreach ($p in 'php\php.exe', 'php\php8.dll', 'renamed\webd.dll') {
              if ($lines -cnotcontains "$F\$p`tphp`t$env:PHP_EXPECT") { throw "$p with php $env:PHP_EXPECT not reported" }
            }
            foreach ($p in 'node\node.exe', 'renamed\jsd.exe') {
              if ($lines -cnotcontains "$F\$p`tnode`t$env:NODE_EXPECT") { throw "$p with node $env:NODE_EXPECT not reported" }
            }
            # the addon decoy: exactly one line, with no version
            $addon = @($lines | Where-Object { $_.StartsWith("$F\addon\addon.node`t") })
            if ($addon.Count -ne 1 -or $addon[0] -cne "$F\addon\addon.node`tnode`tunknown") { throw "addon.node not reported as just node unknown: $($addon -join '; ')" }
            # Electron: exactly two lines, its embedded node and its electron version
            $electron = @($lines | Where-Object { $_.StartsWith("$F\electron\electron.exe`t") })
            if ($electron.Count -ne 2 -or
                $electron -cnotcontains "$F\electron\electron.exe`tnode`t$env:ELECTRON_NODE_EXPECT" -or
                $electron -cnotcontains "$F\electron\electron.exe`telectron`t$env:ELECTRON_EXPECT") {
              throw "electron.exe not reported as just node $env:ELECTRON_NODE_EXPECT and electron $env:ELECTRON_EXPECT: $($electron -join '; ')"
            }
            $bad = @($lines | Where-Object { $_ -like "$F\excluded\*" -or $_ -like "$F\decoys\*" })
            if ($bad.Count) { throw "excluded or decoy file reported: $($bad -join '; ')" }
          }
          # The runner exits with the last native $LASTEXITCODE, which is the
          # scan's expected 1 (matches found); every check above passed
          exit 0
